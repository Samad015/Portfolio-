services:
  - type: web
    name: samad-portfolio-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM
        sync: false
      - key: CONTACT_TO
        sync: false
